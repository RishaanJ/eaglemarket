name: CI

on:
  pull_request:
    branches: [main]
  # Also run on pushes to main so the branch always has a known-good status.
  push:
    branches: [main]

permissions:
  contents: read

# A new push to a PR supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      # The /markets route is prerendered at build time and constructs a Supabase
      # browser client while doing so, which throws if these are absent. CI does
      # not talk to a real project, so well-formed placeholders are enough. Set
      # the repository secrets to build against a real instance instead.
      NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL || 'https://placeholder.supabase.co' }}
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY || 'sb_publishable_ci_placeholder' }}
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ secrets.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      NEXT_TELEMETRY_DISABLED: '1'

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Each check runs even if an earlier one failed, so a single CI run
      # reports every problem instead of only the first.
      - name: Lint
        if: '!cancelled()'
        run: npm run lint

      - name: Typecheck
        if: '!cancelled()'
        run: npm run typecheck

      - name: Build
        if: '!cancelled()'
        run: npm run build

      - name: Test
        if: '!cancelled()'
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            npm test
          else
            echo "No test script defined yet — skipping."
          fi

  database:
    name: Database (pgTAP)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Only the database is needed. `supabase test db` talks to Postgres
      # directly, and auth.users — which the schema's trigger depends on — is
      # created by the postgres image itself, not by GoTrue. Excluding the rest
      # avoids pulling several GB of images that no test touches.
      - name: Start Supabase (database only)
        run: |
          npx supabase start \
            -x studio,mailpit,realtime,storage-api,imgproxy,edge-runtime \
            -x logflare,vector,supavisor,postgrest,postgres-meta,gotrue

      # Applies every migration from scratch, then runs the pgTAP suite. A
      # migration that does not apply cleanly fails here rather than in prod.
      - name: Run pgTAP suite
        run: npx supabase test db

      - name: Stop Supabase
        if: always()
        run: npx supabase stop --no-backup
